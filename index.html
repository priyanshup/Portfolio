<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Old /#/… links → real paths ────────────────────────────────
         The site used hash URLs until Nov 2026 and those links are out in
         the world (LinkedIn, resumes). Rewrite before the app reads the URL:
         /Portfolio/#/case-studies/x → /Portfolio/case-studies/x ─────── -->
    <script>
      if (location.hash.indexOf('#/') === 0) {
        history.replaceState(null, '', '/Portfolio/' + location.hash.slice(2).replace(/^\//, ''));
      }
    </script>

    <!-- ── Google Analytics 4 ─────────────────────────────────────────
         gtag() queues into dataLayer at once; the 165 KB gtag.js itself is
         fetched only after the page has loaded and the browser is idle, so
         it never competes with the page for bandwidth or the main thread.
         Queued hits (the first page_view included) are sent when it arrives.
         send_page_view: false — RouteTracker in App.jsx sends every
         page_view, including the first (avoids double-counting). ──────── -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-43E3DDMJLM', { send_page_view: false });

      (function () {
        function load() {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-43E3DDMJLM';
          document.head.appendChild(s);
        }
        function whenIdle() {
          if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 3000 });
          else setTimeout(load, 1000);
        }
        if (document.readyState === 'complete') whenIdle();
        else window.addEventListener('load', whenIdle, { once: true });
      })();
    </script>
    <!-- ── End Google Analytics ──────────────────────────────────── -->
     
    <!-- ── Primary meta ─────────────────────────────────────────────── -->
    <title>Priyanshu Pushpam | Technical Product Leader</title>
    <meta name="description" content="Product owner with ten years in healthcare, gaming and e-commerce, currently working on digital commerce at Heineken. Case studies, experience and recommendations." />
    <meta name="author" content="Priyanshu Pushpam" />
    <meta name="keywords" content="Product Manager, Product Owner, Technical PM, Digital Commerce, B2B Commerce, AI Product, E-commerce, Sportsbook, Healthcare, CSPO, GCP, AWS" />

    <!-- ── Favicon ───────────────────────────────────────────────────── -->
    <!--
      logo.png must be in your /public folder.
      Browsers that support PNG favicons will use it directly.
      For best cross-browser support, also add a 32×32 PNG named favicon.png.
    -->
    <link rel="icon"       type="image/png" href="/Portfolio/logo.png" />
    <link rel="apple-touch-icon"            href="/Portfolio/logo.png" />

    <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp, Slack) ─────────── -->
    <!--
      og:image must be an ABSOLUTE URL pointing to a publicly accessible image.
      Size: 1200×630px at /public/og-image.png. Regenerate it with
      scripts/generate-og-image.ps1 (see README) — it must NOT be a copy of logo.png.
    -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://priyanshup.github.io/Portfolio/" />
    <meta property="og:title"       content="Priyanshu Pushpam | Technical Product Leader" />
    <meta property="og:description" content="Product owner with ten years in healthcare, gaming and e-commerce, currently working on digital commerce at Heineken. Case studies, experience and recommendations." />
    <meta property="og:image"       content="https://priyanshup.github.io/Portfolio/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Priyanshu Pushpam, Technical Product Leader" />
    <meta property="og:site_name"   content="Priyanshu Pushpam Portfolio" />
    <meta property="og:locale"      content="en_US" />

    <!-- ── Twitter / X Card ─────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:url"         content="https://priyanshup.github.io/Portfolio/" />
    <meta name="twitter:title"       content="Priyanshu Pushpam | Technical Product Leader" />
    <meta name="twitter:description" content="Product owner with ten years in healthcare, gaming and e-commerce, currently working on digital commerce at Heineken. Case studies, experience and recommendations." />
    <meta name="twitter:image"       content="https://priyanshup.github.io/Portfolio/og-image.png" />
    <meta name="twitter:image:alt"   content="Priyanshu Pushpam, Technical Product Leader" />

    <!-- ── LinkedIn specific ─────────────────────────────────────────── -->
    <!--
      LinkedIn uses og: tags above. No separate tags needed.
      However LinkedIn caches OG data heavily — after deploying, use
      https://www.linkedin.com/post-inspector/ to force a cache refresh.
    -->

    <!-- ── Canonical. Title, description, canonical, og:* and twitter:* are
         the homepage's here; scripts/prerender.mjs writes each page's own
         values into its HTML, and useDocumentMeta keeps them in step. ── -->
    <link rel="canonical" href="https://priyanshup.github.io/Portfolio/" />

    <!-- ── Structured data (Person) — helps "Priyanshu Pushpam" searches ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Priyanshu Pushpam",
      "jobTitle": "Product Owner, Digital Commerce",
      "description": "Product owner with ten years in healthcare, gaming and e-commerce.",
      "url": "https://priyanshup.github.io/Portfolio/",
      "image": "https://priyanshup.github.io/Portfolio/me.jpg",
      "worksFor": {
        "@type": "Organization",
        "name": "Heineken",
        "url": "https://www.theheinekencompany.com/"
      },
      "homeLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hyderabad",
          "addressCountry": "IN"
        }
      },
      "knowsAbout": ["Product Management", "Digital Commerce", "E-commerce", "AI Product Development", "Agile Delivery"],
      "sameAs": [
        "https://www.linkedin.com/in/ppushpam/",
        "https://github.com/priyanshup",
        "https://www.instagram.com/mr.pushpam/",
        "https://www.facebook.com/priyanshup"
      ]
    }
    </script>

    <!-- ── Theme colour (browser chrome on mobile) ───────────────────── -->
    <meta name="theme-color" content="#e4e3df" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />

    <!-- ── Preload the display face (latin): it is wide, so arriving after
         first paint would reflow the hero (layout shift). Vite rewrites the
         href to the same hashed file the CSS uses. ─────────────────── -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/node_modules/@fontsource-variable/zalando-sans-expanded/files/zalando-sans-expanded-latin-wght-normal.woff2" />

    <!-- ── Flash prevention: set dark class before first paint ───────── -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- ── Prerendered page (scripts/prerender.mjs fills #root and marks it
         data-prerendered). It's for crawlers, link previews and no-JS
         readers; with JS it stays invisible until main.jsx renders the live
         app over it (see main.jsx for why it isn't hydrated). Without JS it
         is shown, with scroll-reveals switched off. ─────────────────── -->
    <style>#root[data-prerendered] { visibility: hidden; }</style>
    <noscript>
      <style>
        #root[data-prerendered] { visibility: visible; }
        .reveal { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
